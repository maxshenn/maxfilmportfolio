<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destination — Max Shen</title>
  <!-- Favicons. /favicon.ico lives at the SITE ROOT because that is the path crawlers
       request by default — Google falls back to it, and Bing, DuckDuckGo, Yandex and
       Baidu lean on it heavily. It was 404ing, which is why the icon was missing from
       search results even though the page declared one. It is a multi-size ICO: 16 and
       32 for browser tabs, 48 because that is the size Google's search-result favicon
       pipeline works in. Google also wants a square whose side is a multiple of 48, so
       48 and 192 are declared; the 32 that used to be the only PNG was below that and
       got upscaled. Root-absolute paths so they resolve the same from every page and
       from a crawler's own base URL. Keep this block identical across all four pages —
       a favicon that changes between pages is one Google may decline to show. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/public/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="icon" href="/public/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/public/apple-touch-icon.png">
  <!-- Type assets: self-hosted, preload only the two above-the-fold faces.
       See CLAUDE.md › Typography System. -->
  <link rel="preload" href="public/fonts/general-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="public/fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* ── Type assets ──────────────────────────────────────────────
       General Sans (Fontshare, ITF-FFL v2.0 — shipped as-is, unsubset)
       for everything readable; Geist Mono (OFL) for labels only. Each
       family has a metric-matched local fallback so the swap moves
       nothing — layout is identical before and after the font lands. */
    @font-face {
      font-family: "General Sans";
      src: url("public/fonts/general-sans-variable.woff2") format("woff2");
      font-weight: 200 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "General Sans";
      src: url("public/fonts/general-sans-variable-italic.woff2") format("woff2");
      font-weight: 200 700; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: "Geist Mono";
      src: url("public/fonts/geist-mono-latin-wght-normal.woff2") format("woff2");
      font-weight: 100 900; font-style: normal; font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "General Sans Fallback";
      src: local("Arial"), local("Helvetica");
      size-adjust: 108.73%; ascent-override: 92.89%; descent-override: 22.07%; line-gap-override: 9.2%;
    }
    @font-face {
      font-family: "Geist Mono Fallback";
      src: local("Menlo"), local("Courier New");
      size-adjust: 99.66%; ascent-override: 100.84%; descent-override: 29.6%; line-gap-override: 0%;
    }
    :root {
      --font-sans: "General Sans", "General Sans Fallback", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "Geist Mono", "Geist Mono Fallback", ui-monospace, Menlo, Consolas, monospace;
      --tracking-caps: 0.1em;
      --label-muted: #6b6a67; /* 4.9:1 on white — the floor for 12px labels */
    }
    html { -webkit-text-size-adjust: 100%; font-synthesis: none; hanging-punctuation: first last; }
    input, textarea { hanging-punctuation: none; }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-optical-sizing: auto; }
  </style>
  <style>

    /* ── Tokens ───────────────────────────────────────────────── */
    :root {
      --bg:    #ffffff;
      --text:  #1a1917;
      --muted: rgba(26, 25, 23, 0.55);
      --dim:   rgba(26, 25, 23, 0.10);
      --nav-h: 76px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      font-weight: 400;
      line-height: 1;
      overflow-x: hidden;
      /* 0.01, not 0: Safari/WebKit won't paint a new page (it keeps the previous one on screen and
         runs no animation frames) until <body> has NON-ZERO opacity — at exactly 0 it waits for every
         image and video to finish loading before showing anything. 0.01 is invisible but lets it paint. */
      opacity: 0.01;
      transition: opacity 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    body.ready { opacity: 1; }

    /* ── Film grain ───────────────────────────────────────────── */
    #grain {
      position: fixed;
      inset: 0;
      z-index: 9000;
      pointer-events: none;
      opacity: 0.042;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
      mix-blend-mode: screen;
      animation: grain 0.12s steps(1) infinite;
    }
    @keyframes grain {
      0%  { transform: translate(0,0); }
      25% { transform: translate(-5px, 3px); }
      50% { transform: translate(4px, -4px); }
      75% { transform: translate(-3px, 5px); }
    }

    /* ── Nav ──────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 500;
      height: var(--nav-h);
      padding: 0 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    /* nav steps out of the way: hides on scroll-down, returns on scroll-up, always present near the top.
       The transition only arms after the first scroll so the page's own nav reveal keeps its timing. */
    nav.nav-scroll {
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    nav.nav-hidden { opacity: 0; transform: translateY(-14px); pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      nav.nav-scroll { transition: opacity 0.25s ease-out; }
      nav.nav-hidden { transform: none; }
    }
    /* Page transitions — arrival and exit mirror each other. Arriving: the content rises
       into place from 18px below while fading in (0.7s expo-out). Leaving: it lifts away
       18px while fading out (0.55s page-transition curve). The fixed nav only fades. */
    body { transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1); }
    body > section, body > main, body > .contact-section {
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    html.page-enter body { opacity: 0.01; transition: none; } /* non-zero: WebKit will not paint a page whose <body> is at opacity 0 */
    html.page-enter body > section, html.page-enter body > main, html.page-enter body > .contact-section {
      transform: translateY(18px); transition: none;
    }
    html.page-exit body { opacity: 0; transition: opacity 0.5s cubic-bezier(0.76, 0, 0.24, 1); }
    html.page-exit body > section, html.page-exit body > main, html.page-exit body > .contact-section {
      transform: translateY(-18px); transition: transform 0.55s cubic-bezier(0.76, 0, 0.24, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      html.page-enter body > section, html.page-enter body > main, html.page-enter body > .contact-section,
      html.page-exit body > section, html.page-exit body > main, html.page-exit body > .contact-section { transform: none; }
    }
    .nav-name {
      font-family: var(--font-sans);
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #000;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 40px;
      list-style: none;
    }
    /* Nav: 14px / 500 / sentence case / 0 tracking — the body family, one
       tier quieter than the wordmark. Hover idiom of the tier: siblings
       recede, the hovered link holds. */
    .nav-links a {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      line-height: 1;
      color: #000;
      text-decoration: none;
      opacity: 1;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-links:hover a:not(:hover) { opacity: 0.45; }

    .nav-hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      z-index: 600;
      position: relative;
    }
    .nav-hamburger span {
      display: block;
      width: 22px;
      height: 1px;
      background: rgba(26,25,23,0.85);
      transition: transform 0.32s cubic-bezier(0.16,1,0.3,1),
                  opacity 0.22s ease, background 0.3s;
      transform-origin: center;
    }
    .nav-hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    #mobileMenu {
      position: fixed;
      inset: 0;
      z-index: 490;
      background: rgba(255,255,255,0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s cubic-bezier(0.22,0.61,0.36,1);
    }
    #mobileMenu.open { opacity: 1; pointer-events: all; }
    #mobileMenu ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }
    #mobileMenu a {
      font-family: var(--font-sans);
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.01em;
      text-transform: none;
      color: #000;
      text-decoration: none;
      transition: color 0.22s;
    }
    #mobileMenu a:active { color: #000; }

    /* ── Fade-up animation ────────────────────────────────────── */
    .fade-up {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.9s cubic-bezier(0.22, 0.61, 0.36, 1),
                  transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .fade-up.in { opacity: 1; transform: translateY(0); }

    /* ── Page ─────────────────────────────────────────────────── */
    .dest-page {
      max-width: 2100px;
      margin: 0 auto;
      padding: calc(var(--nav-h) + 28px) 44px 100px;
    }

    .dest-page-title {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: clamp(36px, 6vw, 68px);
      letter-spacing: -0.01em;
      color: #000;
      text-align: center;
      margin: 0 0 20px;
    }

    /* black, but held back from the 800-weight title by weight and a
       touch of alpha — reads as body copy, not a second headline */
    .dest-page-caption {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.7;
      color: rgba(0, 0, 0, 0.78);
      text-align: center;
      max-width: 680px; /* wide enough for the Vancouver line to sit unbroken */
      margin: 0 auto 48px;
    }

    /* ── Mosaic — a real masonry: every photo renders at its own
       natural aspect ratio (nothing is cropped). JS sorts photos into
       N column divs (shortest-column-first, using each photo's known
       aspect ratio), and this flex layout does the rest: a flex row's
       default align-items:stretch makes every .mosaic-col match the
       tallest one, and the leftover space lands after each column's
       last child — an invisible pad that flushes every column to the
       same bottom edge without cropping a single photo. ── */
    .mosaic {
      display: flex;
      gap: 18px;
    }
    .mosaic-col {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .m-item {
      overflow: hidden;
      background: #0d0c0b;
    }
    .m-item img {
      display: block;
      width: 100%;
      height: auto;
      filter: brightness(1.04) saturate(1.18);
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .m-item:hover img {
      transform: scale(1.035);
    }

    /* ── Contact — icon row + handle, footer-style ──────────────── */
    .contact-section {
      padding: 96px 40px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .contact-icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
    }
    .contact-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      text-decoration: none;
      transition: color 0.22s, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .contact-icon:hover {
      color: var(--muted);
      transform: scale(1.12);
    }
    .contact-icon:active { transform: scale(0.94); }
    .contact-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .contact-handle {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 20px;
    }
    .contact-copy {
      margin: 10px 0 0;
      font-family: var(--font-sans); /* same voice as the email line above it */
      font-size: 15px;
      font-weight: 400;
      color: var(--muted);
    }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 960px) {
      nav { padding: 0 24px; }
      .nav-links { display: none; }
      .nav-hamburger { display: flex; }
      .dest-page { padding: calc(var(--nav-h) + 24px) 24px 80px; }
      .mosaic { gap: 10px; }
      .mosaic-col { gap: 10px; }
    }

    @media (max-width: 560px) {
      .dest-page-title { margin-bottom: 32px; }
      .mosaic { gap: 14px; }
      .mosaic-col { gap: 14px; }
      .contact-section { padding: 64px 24px 32px; }
    }

    /* ── Touch screens, tablets and phones ─────────────────────────
       Everything from here to the wordmark block sits inside a
       max-width / hover:none query — none of it reaches the desktop. */
    @media (max-width: 960px) {
      a, button { -webkit-tap-highlight-color: transparent; }

      /* The nav comes back over the photos on scroll-up. Give it a backing
         there (JS adds .nav-solid once the page has moved) so the hollow
         wordmark and the 1px burger lines never sit on a busy frame. */
      nav::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: rgba(255, 255, 255, 0.9);
        -webkit-backdrop-filter: saturate(1.6) blur(16px);
        backdrop-filter: saturate(1.6) blur(16px);
        opacity: 0;
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      nav.nav-solid::before { opacity: 1; }

      /* wordmark link: 40px mark, 44px target */
      .nav-name { display: block; padding: 2px 0; }

      /* burger: a 44px target whose lines end on the same 24px gutter as the photos */
      .nav-hamburger {
        width: 44px;
        height: 44px;
        padding: 0 11px;
        margin-right: -11px;
        transition: transform 0.4s cubic-bezier(0.625, 0.05, 0, 1);
      }
      .nav-hamburger:active { transform: scale(0.9); }
      .nav-hamburger:focus-visible { outline: 2px solid #000; outline-offset: 2px; border-radius: 4px; }

      /* menu: an opaque sheet (photos used to ghost through it), out of the
         tab order while closed, links on 56px targets that rise in one after another */
      #mobileMenu {
        background: #fff;
        visibility: hidden;
        overscroll-behavior: contain;
        touch-action: none;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s linear 0.4s;
      }
      #mobileMenu.open {
        visibility: visible;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s;
      }
      #mobileMenu ul { gap: 8px; }
      #mobileMenu li {
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #mobileMenu.open li {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #mobileMenu.open li:nth-child(1) { transition-delay: 0.06s; }
      #mobileMenu.open li:nth-child(2) { transition-delay: 0.12s; }
      #mobileMenu.open li:nth-child(3) { transition-delay: 0.18s; }
      #mobileMenu.open li:nth-child(4) { transition-delay: 0.24s; }
      #mobileMenu a {
        display: block;
        padding: 14px 32px;
        font-size: 28px;
        line-height: 1;
        transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #mobileMenu a:active { opacity: 0.45; }
      #mobileMenu a:focus-visible { outline: 2px solid #000; outline-offset: -4px; border-radius: 4px; }

      /* title wraps on phones: even lines, a little air between them */
      .dest-page-title { line-height: 1.05; text-wrap: balance; }
      .dest-page-caption { text-wrap: balance; }

      /* photos arrive as a fade on a pale plate, not a pop-in on a black box */
      .m-item { background: #f1f0ed; }
      .m-item img {
        opacity: 0;
        transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .m-item img.is-in { opacity: 1; }

      /* footer: 44px icon targets on the same 48px pitch, text at 4.5:1 */
      .contact-icons { gap: 4px; }
      .contact-icon { width: 44px; height: 44px; }
      .contact-handle { margin-top: 8px; }
      .contact-handle, .contact-copy { color: var(--label-muted); }
    }

    @media (max-width: 960px) and (prefers-reduced-motion: reduce) {
      #mobileMenu li, #mobileMenu.open li { transform: none; transition: opacity 0.25s ease-out; transition-delay: 0s; }
      .nav-hamburger, .nav-hamburger:active { transform: none; transition: none; }
      .m-item img { transition: opacity 0.25s ease-out; }
      #grain { animation: none; } /* the texture stays, the perpetual jitter stops */
      .fade-up, .fade-up.in { transform: none; transition: opacity 0.25s ease-out; }
    }

    /* Phones: the mosaic becomes a rhythm of rows — one full-width frame, then a
       pair sized so both photos share a height (JS sets each cell's flex-grow to
       its aspect ratio). Rows are flush by construction: no ragged column ends. */
    @media (max-width: 560px) {
      .dest-page { padding-top: calc(var(--nav-h) + 16px); padding-bottom: 64px; }
      .dest-page-title { margin-bottom: 16px; }
      .dest-page-caption { margin-bottom: 40px; }
      .mosaic { flex-direction: column; gap: 8px; }
      .mosaic-row { display: flex; align-items: flex-start; gap: 8px; }
      .mosaic-row .m-item { min-width: 0; }
      .mosaic-row .m-item img { height: 100%; object-fit: cover; }
    }

    /* Touch: :hover sticks after a tap, so the hover dressing stays off */
    @media (hover: none) {
      .m-item:hover img { transform: none; }
      .contact-icon:hover { color: var(--text); transform: none; }
      .contact-icon:active { color: var(--muted); transform: scale(0.94); }
    }

      .nav-name:focus-visible { outline: 2px solid #000; outline-offset: 6px; border-radius: 4px; }
    .nav-name svg { display: block; overflow: visible; }

    /* Bubbly animated wordmark — MAX SHEN framed by a comic "boom" burst
       outline. Intro (once per session): a starburst + radial light rays
       detonate at the name's center, the letters are thrown outward through
       the blast — materializing from flash-amber to black with squash
       landings — then the jagged boom outline snaps in around the name and
       a shockwave echo expands off it. Hovering a letter boops it; hovering
       the mark jolts the boom outline. */
    .wm-l { transform-box: fill-box; transform-origin: 50% 100%; }
    .wm-l path { fill: none; stroke: #000; stroke-linecap: round; stroke-linejoin: round; }
    .wm-l .wm-shine { stroke: #fff; opacity: 0.85; }
    .wm-l .wm-hit { fill: transparent; stroke: none; }

    /* boom outline: persistent part of the lockup */
    .wm-boom { transform-box: fill-box; transform-origin: 50% 50%; }
    .wm-shock { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; }
    .wm-flash { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; }
    .wm-rays { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; }
    .wm-rays-a, .wm-rays-b { transform-box: fill-box; transform-origin: 50% 50%; }

    /* ── intro: detonation ── */
    .wm-intro .wm-flash { animation: wm-flash 0.5s ease-out both; }
    @keyframes wm-flash {
      0%   { opacity: 0; transform: scale(0) rotate(-20deg); }
      22%  { opacity: 1; transform: scale(1.7) rotate(-6deg); }
      55%  { opacity: 1; transform: scale(2.1) rotate(2deg); }
      100% { opacity: 0; transform: scale(2.6) rotate(8deg); }
    }
    .wm-intro .wm-rays { animation: rays-burst 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.04s both; }
    .wm-intro .wm-rays-a { animation: rays-spin-a 0.8s linear 0.04s both; }
    .wm-intro .wm-rays-b { animation: rays-spin-b 0.8s linear 0.04s both; }
    @keyframes rays-burst {
      0%   { opacity: 0; transform: scale(0.1); }
      18%  { opacity: 1; transform: scale(0.9); }
      55%  { opacity: 0.85; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(1.16); }
    }
    @keyframes rays-spin-a { from { transform: rotate(-5deg); } to { transform: rotate(4deg); } }
    @keyframes rays-spin-b { from { transform: rotate(5deg); } to { transform: rotate(-4deg); } }

    .wm-intro .wm-l { animation: wm-eject 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
                      animation-delay: calc(0.12s + var(--d)); }
    .wm-intro .wm-l .wm-ink { animation: wm-materialize 0.7s ease-out both;
                              animation-delay: calc(0.12s + var(--d)); }
    @keyframes wm-materialize {
      0%   { stroke: #ffd76a; }
      40%  { stroke: #c98a2c; }

      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    .wm-intro .wm-shock { animation: shock-out 0.6s ease-out 0.86s both; }
    @keyframes shock-out {
      0%   { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 0; transform: scale(1.3); }
    }

        caption: 'One week of beach hopping, too much Ibérico ham, and trying to recreate the Limitless edit.',
        photos: SPAIN_PHOTOS,
      },
      japan: {
        title: 'Tokyo, Osaka, & Kamakura',
        caption: 'Some of the best scenery in the world. Temples, Shibuya Crossing, small beach towns, and 7-Eleven iced vanilla lattes.',
        photos: JAPAN_PHOTOS,
      },
      italy: {
        title: 'The Dolomites',
        caption: 'Grad trip through the Dolomites. Five days, five hostels, one thunderstorm, and some of the most beautiful views I’ve ever seen. Unforgettable trip.',
        photos: ITALY_PHOTOS,
      },
      vancouver: {
        title: 'Vancouver',
        caption: 'The best city in the world. Beaches, great food, great people, and the only place I can drive a car.',
        photos: VANCOUVER_PHOTOS,
      },
      morocco: {
        title: 'Marrakech',
        caption: 'Missed the trip, but not the footage. Frames shot by my friend Brent, color graded by me.',
        photos: MOROCCO_PHOTOS,
      },
    };

    function placeholderPhotos(title, count) {
      const arr = [];
      for (let i = 1; i <= count; i++) {
        const h = 600 + (i % 3) * 150;
        arr.push({
          src: 'https://placehold.co/900x' + h + '/1a1917/3a3936?text=' +
            encodeURIComponent(title) + '+' + i,
          w: 900, h: h,
        });
      }
      return arr;
    }

    const params = new URLSearchParams(window.location.search);
    const slug   = params.get('place') || 'spain';
    const place  = PLACES[slug] || PLACES.spain;

    // Phones and tablets (≤960px) get the lighter m/ photo variants, the row
    // layout and the touch niceties below. Desktop takes none of these branches.
    const SMALL_SCREEN = window.matchMedia('(max-width: 960px)');

    document.title = place.title + ' — Max Shen';
    // where the title wraps, the ampersand travels with the word after it
    // ("MALLORCA / & IBIZA", never "MALLORCA & / IBIZA")
    document.getElementById('destPageTitle').textContent =
      SMALL_SCREEN.matches ? place.title.replace(/& /g, '& ') : place.title;

    const captionEl = document.getElementById('destPageCaption');
    if (place.caption) {
      captionEl.textContent = place.caption;
    } else {
      captionEl.remove();
    }

    const mosaic = document.getElementById('destPageMosaic');
    const photos = (place.photos && place.photos.length) ? place.photos : placeholderPhotos(place.title, 8);

    // Split photos into N column divs, always adding the next photo to
    // whichever column is shortest so far (tracked via aspect-ratio sum,
    // since that's proportional to real height at any column width). The
    // flex CSS above turns that into a flush bottom automatically.
    function colCountForWidth(w) {
      if (w <= 560) return 1;
      if (w <= 960) return 2;
      return 3;
    }

    // public/destinations/<place>/<name>.<ext> → public/destinations/<place>/m/<name>.jpg
    // (long edge 1400px, ~150–250 KB where the originals run 3–6 MB).
    function phoneSrc(src) {
      if (src.indexOf('public/destinations/') !== 0) return src;
      const cut = src.lastIndexOf('/');
      return src.slice(0, cut) + '/m/' + src.slice(cut + 1).replace(/\.[^.]+$/, '') + '.jpg';
    }

    // One photo cell. The cell's aspect-ratio reserves the space, so nothing
    // moves when the image lands. `small` = phone/tablet: m/ variant (falling
    // back to the original if a variant is ever missing), first screen eager,
    // async decode, fade in on load.
    function makeCell(p, i, small, eager) {
      const w = p.w || 4, h = p.h || 3;
      const cell = document.createElement('div');
      cell.className = 'm-item';
      cell.style.aspectRatio = w + ' / ' + h;
      const img = document.createElement('img');
      if (small) {
        const lite = phoneSrc(p.src);
        const show = function () { img.classList.add('is-in'); };
        img.decoding = 'async';
        img.loading = eager ? 'eager' : 'lazy';
        if (eager && i === 0) img.fetchPriority = 'high';
        img.addEventListener('load', show);
        img.addEventListener('error', function () {
          if (lite !== p.src && img.getAttribute('src') === lite) img.src = p.src;
          else show();
        });
        img.alt = place.title + ' — photo ' + (i + 1);
        img.src = lite;
        if (img.complete && img.naturalWidth) show();
      } else {
        img.src = p.src;
        img.alt = place.title + ' — photo ' + (i + 1);
        img.loading = 'lazy';
      }
      cell.appendChild(img);
      return cell;
    }

    // Phones: rows instead of columns — a full-width frame, then a pair, in the
    // photos' own order. In a pair each cell's flex-grow is its aspect ratio, so
    // the two widths come out proportional and both photos share one height.
    function buildRows() {
      let i = 0, single = true;
      while (i < photos.length) {
        const take = (single || i === photos.length - 1) ? 1 : 2;
        const row = document.createElement('div');
        row.className = 'mosaic-row';
        for (let k = i; k < i + take; k++) {
          const cell = makeCell(photos[k], k, true, k < 4);
          cell.style.flex = ((photos[k].w || 4) / (photos[k].h || 3)) + ' 1 0';
          row.appendChild(cell);
        }
        mosaic.appendChild(row);
        i += take;
        single = !single;
      }
    }

    // Two columns (tablets, phones held sideways): greedy alone can leave one
    // column most of a photo short (Spain: 166px), more than the gap-stretch in
    // balanceMosaicBottoms() can hide. With ≤22 photos every split is cheap to
    // try (2^(n-2), the top row stays put), so take the split whose two heights
    // are closest — and among equals, the one that moves the fewest photos off
    // their greedy column, which keeps the reading order. What is left is a few
    // px for the gap-stretch. Heights are in units of column width;
    // gapRatio = row gap / column width.
    function refineTwoColumns(assign, gapRatio) {
      const n = photos.length;
      if (n < 4 || n > 22) return;
      const r = photos.map(function (p) { return (p.h || 3) / (p.w || 4); });
      const greedy = assign.slice(), cur = assign.slice();
      const TIE = 0.025; // ≈9px at these column widths: within that the gap-stretch is invisible, so it's a tie
      let bestDiff = Infinity, bestMoves = Infinity, best = null;
      function walk(i, diff, inFirst, moves) {
        if (i === n) {
          const d = Math.floor(Math.abs(diff + (2 * inFirst - n) * gapRatio) / TIE);
          if (d < bestDiff || (d === bestDiff && moves < bestMoves)) { bestDiff = d; bestMoves = moves; best = cur.slice(); }
          return;
        }
        for (let c = 0; c < 2; c++) {
          cur[i] = c;
          walk(i + 1, diff + (c === 0 ? r[i] : -r[i]), inFirst + (c === 0 ? 1 : 0), moves + (c === greedy[i] ? 0 : 1));
        }
      }
      let diff0 = 0, first0 = 0;
      for (let i = 0; i < 2; i++) { diff0 += greedy[i] === 0 ? r[i] : -r[i]; if (greedy[i] === 0) first0++; }
      walk(2, diff0, first0, 0);
      if (best) best.forEach(function (c, i) { assign[i] = c; });
    }

    function buildMosaic() {
      const colCount = colCountForWidth(window.innerWidth);
      const small = SMALL_SCREEN.matches;
      mosaic.innerHTML = '';

      if (colCount === 1) {
        buildRows();
        return colCount;
      }

      const cols = [];
      for (let c = 0; c < colCount; c++) {
        const col = document.createElement('div');
        col.className = 'mosaic-col';
        mosaic.appendChild(col);
        cols.push({ el: col, ratioSum: 0 });
      }

      // shortest-column-first, exactly as before; the column index is noted per
      // photo so the two-column case can be refined before any cell is built
      const assign = photos.map(function (p) {
        let target = 0;
        for (let c = 1; c < cols.length; c++) {
          if (cols[c].ratioSum < cols[target].ratioSum) target = c;
        }
        cols[target].ratioSum += (p.h || 3) / (p.w || 4);
        return target;
      });

      if (colCount === 2) {
        const gap = parseFloat(getComputedStyle(cols[0].el).rowGap) || 10;
        const colWidth = cols[0].el.getBoundingClientRect().width || 1;
        refineTwoColumns(assign, gap / colWidth);
      }

      photos.forEach(function (p, i) {
        cols[assign[i]].el.appendChild(makeCell(p, i, small, small && i < 4));
      });

      balanceMosaicBottoms();

      return colCount;
    }

    // Columns rarely balance to the exact pixel: photo counts differ (extra
    // row-gaps) and aspect-ratio sums never split perfectly three ways.
    // Stretch gaps so all columns end on the same line — but never the first
    // two gaps, so the top rows stay perfectly aligned across columns. The
    // correction goes into the lower gaps (as margin-top on cells 4+), where
    // tile shapes vary and a few extra pixels are invisible. Gap widths
    // depend on rendered column width, so this re-runs on every resize.
    function balanceMosaicBottoms() {
      const KEEP = 2; // number of leading gaps locked to the base value
      const colEls = Array.prototype.slice.call(mosaic.children);
      if (colEls.length < 2) return;
      if (!colEls[0].classList.contains('mosaic-col')) return; // phone rows: flush by construction
      colEls.forEach(function (el) {
        Array.prototype.forEach.call(el.children, function (cell) { cell.style.marginTop = ''; });
      });
      const baseGap = parseFloat(getComputedStyle(colEls[0]).rowGap) || 18;
      const colWidth = colEls[0].getBoundingClientRect().width;
      const data = colEls.map(function (el) {
        let sum = 0;
        Array.prototype.forEach.call(el.children, function (cell) {
          const parts = (cell.style.aspectRatio || '1 / 1').split('/');
          sum += parseFloat(parts[1]) / parseFloat(parts[0]);
        });
        return { el: el, h: colWidth * sum, gaps: el.children.length - 1 };
      });
      const target = Math.max.apply(null, data.map(function (d) { return d.h + d.gaps * baseGap; }));
      data.forEach(function (d) {
        const stretchable = Math.max(d.gaps - KEEP, 0);
        if (stretchable < 1) return;
        const extra = Math.min(target - (d.h + d.gaps * baseGap), stretchable * baseGap * 2);
        if (extra < 0.05) return;
        const per = extra / stretchable;
        Array.prototype.forEach.call(d.el.children, function (cell, idx) {
          if (idx > KEEP) cell.style.marginTop = per + 'px';
        });
      });
    }

    let mosaicColCount = buildMosaic();
    let mosaicResizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(mosaicResizeTimer);
      mosaicResizeTimer = setTimeout(function () {
        const next = colCountForWidth(window.innerWidth);
        if (next !== mosaicColCount) {
          mosaicColCount = next;
          buildMosaic();
        } else {
          balanceMosaicBottoms();
        }
      }, 200);
    });

    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        document.body.classList.add('ready');
        document.querySelectorAll('.fade-up').forEach(el => el.classList.add('in'));
      }));
    });

    // ── Mobile hamburger menu ─────────────────────────────────
    const hamburger  = document.getElementById('navHamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    function toggleMenu(force) {
      const open = typeof force === 'boolean' ? force : !hamburger.classList.contains('open');
      hamburger.classList.toggle('open', open);
      mobileMenu.classList.toggle('open', open);
      mobileMenu.setAttribute('aria-hidden', String(!open));
      hamburger.setAttribute('aria-expanded', String(open));
      hamburger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      document.body.style.overflow = open ? 'hidden' : '';
    }

    hamburger.addEventListener('click', () => toggleMenu());

    // Fade to black before leaving — every nav link here goes back to
    // index.html, there's nowhere on this page itself to navigate to.
    document.querySelectorAll('#home-link, .nav-links a, #mobileMenu a').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        toggleMenu(false);
        const dest = el.getAttribute('href');
        pageLeave(dest);
      });
    });

    // ── Page enter ────────────────────────────────────────────
    // Arrivals fade in over 0.55s (the exit fade's length), so a fresh
    // load, a link, and the browser's Back button all feel the same.
    // On a bfcache restore the exit fade's inline opacity:0 is still on
    // <body>; restart the fade from there instead of snapping to 1.
    (function () {
      const html = document.documentElement, body = document.body;
      function enter() {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { html.classList.remove('page-enter'); });
        });
      }
      enter();
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        body.style.transition = 'none';
        body.style.opacity = '';
        html.classList.remove('page-exit');
        html.classList.add('page-enter');
        void body.offsetWidth;
        body.style.transition = '';
        enter();
      });
    })();
  </script>

  <script>
    // Wordmark: once-per-session explosion intro, hover boops + boom jolt.
    (function () {
      const mark = document.querySelector('.wordmark');
      if (!mark) return;
      const letters = mark.querySelectorAll('.wm-l');
      const boom = mark.querySelector('.wm-boom');
      // Once per tab. The read is GUARDED: with storage blocked (cookies off, some private
      // modes and in-app browsers) getItem throws, and unguarded it killed this whole script
      // — no wordmark intro, and no hover boops either, because the listeners below never
      // attached. With no memory every page counts as the first, EXCEPT while the site's
      // loader owns this page load (si-lock / si-fade on <html>): the loader used to
      // suppress this through the same flag, and that coupling has to survive without storage.
      var loaderOwnsIt = /\bsi-(lock|fade)\b/.test(document.documentElement.className);
      var first = false;
      try {
        first = !sessionStorage.getItem('wmIntroPlayed');
        if (first) sessionStorage.setItem('wmIntroPlayed', '1');
      } catch (e) { first = true; }
      if (first && !loaderOwnsIt) {
        mark.classList.add('wm-intro');
        setTimeout(function () { mark.classList.remove('wm-intro'); }, 1700);
      }
      letters.forEach(function (l) {
        l.addEventListener('animationend', function () { l.classList.remove('wm-boop'); });
        l.addEventListener('mouseenter', function () {
          if (!mark.classList.contains('wm-intro') && !l.classList.contains('wm-boop')) l.classList.add('wm-boop');
        });
      });
      if (boom) {
        boom.addEventListener('animationend', function () { boom.classList.remove('wm-jolt'); });
        mark.addEventListener('mouseenter', function () {
          if (!mark.classList.contains('wm-intro') && !boom.classList.contains('wm-jolt')) boom.classList.add('wm-jolt');
        });
      }
    })();
  </script>
  <script>
    // Hide the nav while scrolling down, bring it back on scroll-up or near the top,
    // and never while the mobile menu is open.
    (function () {
      const nav = document.querySelector('nav');
      if (!nav) return;
      const SHOW_AT = 80, DELTA = 6;
      let last = window.scrollY, hidden = false, ticking = false;
      const small = window.matchMedia('(max-width: 960px)');
      function update() {
        ticking = false;
        let y = window.scrollY;
        if (small.matches) {
          // iOS rubber-banding reports scroll positions past both ends; read them as the
          // ends, or the bounce at the foot of the page counts as a scroll-up and pops the nav in
          y = Math.max(0, Math.min(y, document.documentElement.scrollHeight - window.innerHeight));
          // backing behind the nav whenever it can sit over content (see nav::before)
          nav.classList.toggle('nav-solid', y > 8);
        }
        const menuOpen = !!document.querySelector('.nav-hamburger.open');
        let want = hidden;
        if (menuOpen || y <= SHOW_AT || y < last - DELTA) want = false;
        else if (y > last + DELTA) want = true;
        if (want !== hidden) { hidden = want; nav.classList.toggle('nav-hidden', hidden); }
        last = y;
      }
      window.addEventListener('scroll', function () {
        nav.classList.add('nav-scroll');
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }, { passive: true });
      if (small.matches) update(); // a reload restored mid-page still gets the backing
    })();

    // Phones / tablets: every photo opens in a full-screen viewer with ‹ 3 / 15 › at the bottom
    // (public/js/photo-lightbox.js). Requested only on small or touch screens, so desktop loads
    // nothing new and its DOM is untouched.
    if (window.matchMedia('(max-width: 960px), (pointer: coarse)').matches) {
      window.PHOTO_LIGHTBOX = { selector: '#destPageMosaic .m-item img' };
      const plb = document.createElement('script');
      plb.src = 'public/js/photo-lightbox.js';
      document.body.appendChild(plb);
    }
  </script>
</body>
</html>
