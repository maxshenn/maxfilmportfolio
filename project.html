<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Max Shen</title>
  <link rel="icon" href="public/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="public/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="public/apple-touch-icon.png">
  <!-- Type assets: self-hosted, preload only the two above-the-fold faces.
       See CLAUDE.md › Typography System. -->
  <link rel="preload" href="public/fonts/general-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="public/fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* ── Type assets ──────────────────────────────────────────────
       General Sans (Fontshare, ITF-FFL v2.0 — shipped as-is, unsubset)
       for everything readable; Geist Mono (OFL) for labels only. Each
       family has a metric-matched local fallback so the swap moves
       nothing — layout is identical before and after the font lands. */
    @font-face {
      font-family: "General Sans";
      src: url("public/fonts/general-sans-variable.woff2") format("woff2");
      font-weight: 200 700; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "General Sans";
      src: url("public/fonts/general-sans-variable-italic.woff2") format("woff2");
      font-weight: 200 700; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: "Geist Mono";
      src: url("public/fonts/geist-mono-latin-wght-normal.woff2") format("woff2");
      font-weight: 100 900; font-style: normal; font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "General Sans Fallback";
      src: local("Arial"), local("Helvetica");
      size-adjust: 108.73%; ascent-override: 92.89%; descent-override: 22.07%; line-gap-override: 9.2%;
    }
    @font-face {
      font-family: "Geist Mono Fallback";
      src: local("Menlo"), local("Courier New");
      size-adjust: 99.66%; ascent-override: 100.84%; descent-override: 29.6%; line-gap-override: 0%;
    }
    :root {
      --font-sans: "General Sans", "General Sans Fallback", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "Geist Mono", "Geist Mono Fallback", ui-monospace, Menlo, Consolas, monospace;
      --tracking-caps: 0.1em;
      --label-muted: #6b6a67; /* 4.9:1 on white — the floor for 12px labels */
    }
    html { -webkit-text-size-adjust: 100%; font-synthesis: none; hanging-punctuation: first last; }
    input, textarea { hanging-punctuation: none; }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-optical-sizing: auto; }
  </style>
  <style>

    /* ── Tokens ───────────────────────────────────────────────── */
    :root {
      --bg:    #ffffff;
      --text:  #1a1917;
      --muted: rgba(26, 25, 23, 0.55);
      --dim:   rgba(26, 25, 23, 0.10);
      --nav-h: 76px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      font-weight: 400;
      line-height: 1;
      overflow-x: hidden;
      /* 0.01, not 0: Safari/WebKit won't paint a new page (it keeps the previous one on screen and
         runs no animation frames) until <body> has NON-ZERO opacity — at exactly 0 it waits for every
         image and video to finish loading before showing anything. 0.01 is invisible but lets it paint. */
      opacity: 0.01;
      transition: opacity 0.7s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    body.ready { opacity: 1; }

    /* ── Film grain ───────────────────────────────────────────── */
    #grain {
      position: fixed;
      inset: 0;
      z-index: 9000;
      pointer-events: none;
      opacity: 0.042;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
      mix-blend-mode: screen;
      animation: grain 0.12s steps(1) infinite;
    }
    @keyframes grain {
      0%  { transform: translate(0,0); }
      25% { transform: translate(-5px, 3px); }
      50% { transform: translate(4px, -4px); }
      75% { transform: translate(-3px, 5px); }
    }

    /* ── Nav ──────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 500;
      height: var(--nav-h);
      padding: 0 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    /* nav steps out of the way: hides on scroll-down, returns on scroll-up, always present near the top.
       The transition only arms after the first scroll so the page's own nav reveal keeps its timing. */
    nav.nav-scroll {
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    nav.nav-hidden { opacity: 0; transform: translateY(-14px); pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      nav.nav-scroll { transition: opacity 0.25s ease-out; }
      nav.nav-hidden { transform: none; }
    }
    /* Page transitions — arrival and exit mirror each other. Arriving: the content rises
       into place from 18px below while fading in (0.7s expo-out). Leaving: it lifts away
       18px while fading out (0.55s page-transition curve). The fixed nav only fades. */
    body { transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1); }
    body > section, body > main, body > .contact-section {
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    html.page-enter body { opacity: 0.01; transition: none; } /* non-zero: WebKit will not paint a page whose <body> is at opacity 0 */
    html.page-enter body > section, html.page-enter body > main, html.page-enter body > .contact-section {
      transform: translateY(18px); transition: none;
    }
    html.page-exit body { opacity: 0; transition: opacity 0.5s cubic-bezier(0.76, 0, 0.24, 1); }
    html.page-exit body > section, html.page-exit body > main, html.page-exit body > .contact-section {
      transform: translateY(-18px); transition: transform 0.55s cubic-bezier(0.76, 0, 0.24, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      html.page-enter body > section, html.page-enter body > main, html.page-enter body > .contact-section,
      html.page-exit body > section, html.page-exit body > main, html.page-exit body > .contact-section { transform: none; }
    }
    .nav-name {
      font-family: var(--font-sans);
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #000;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 40px;
      list-style: none;
    }
    /* Nav: 14px / 500 / sentence case / 0 tracking — the body family, one
       tier quieter than the wordmark. Hover idiom of the tier: siblings
       recede, the hovered link holds. */
    .nav-links a {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      line-height: 1;
      color: #000;
      text-decoration: none;
      opacity: 1;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-links:hover a:not(:hover) { opacity: 0.45; }

    .nav-hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      z-index: 600;
      position: relative;
    }
    .nav-hamburger span {
      display: block;
      width: 22px;
      height: 1px;
      background: rgba(26,25,23,0.85);
      transition: transform 0.32s cubic-bezier(0.16,1,0.3,1),
                  opacity 0.22s ease, background 0.3s;
      transform-origin: center;
    }
    .nav-hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    #mobileMenu {
      position: fixed;
      inset: 0;
      z-index: 490;
      background: rgba(255,255,255,0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s cubic-bezier(0.22,0.61,0.36,1);
    }
    #mobileMenu.open { opacity: 1; pointer-events: all; }
    #mobileMenu ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }
    #mobileMenu a {
      font-family: var(--font-sans);
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.01em;
      text-transform: none;
      color: #000;
      text-decoration: none;
      transition: color 0.22s;
    }
    #mobileMenu a:active { color: #000; }

    /* ── Fade-up animation ────────────────────────────────────── */
    .fade-up {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.9s cubic-bezier(0.22, 0.61, 0.36, 1),
                  transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .fade-up.in { opacity: 1; transform: translateY(0); }

    /* ── Page ─────────────────────────────────────────────────── */
    .dest-page {
      max-width: 1700px;
      margin: 0 auto;
      padding: calc(var(--nav-h) + 28px) 64px 100px;
    }

    .dest-page-title {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: clamp(36px, 6vw, 68px);
      letter-spacing: -0.01em;
      color: #000;
      text-align: center;
      margin: 0 0 20px;
    }

    .dest-page-caption {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--muted);
      text-align: center;
      max-width: 640px;
      margin: 0 auto 48px;
    }

    /* ── Project page: intentional load choreography — the media
       unmasks first (clip-path + settle, expo-out), the title rises
       after it on the same ready trigger. ── */
    .proj-page {
      max-width: 1240px;
      margin: 0 auto;
      padding: calc(var(--nav-h) + 28px) 64px 40px;
    }
    .proj-page .dest-page-title {
      transition-delay: 0.4s;
      margin-bottom: 36px;
    }
    /* Subtitle: same voice as the destination captions — black held back
       to 78% so it reads as body copy under the 700-weight title. Enters
       one beat after the title in the load choreography. */
    .proj-page-caption {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.7;
      color: rgba(0, 0, 0, 0.78);
      text-align: center;
      text-wrap: pretty;
      max-width: 640px;
      margin: -8px auto 40px;
      transition-delay: 0.55s;
    }
    .proj-page-caption p + p { margin-top: 14px; }
    .proj-page-note { margin: 40px auto 0; transition-delay: 0.7s; }
    /* a paragraph given as { heading } — the title's voice, one tier smaller */
    .proj-copy-heading {
      font-weight: 700;
      font-size: clamp(22px, 2.6vw, 32px);
      line-height: 1.15;
      letter-spacing: -0.015em;
      color: #000;
      text-wrap: balance;
    }
    .proj-page-caption a {
      color: #000;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .proj-page-caption a:hover { opacity: 0.55; }
    .proj-page-caption a:focus-visible { outline: 2px solid #000; outline-offset: 3px; border-radius: 2px; }
    /* The film/still is laid out at its final size from the first paint and simply
       fades and rises in with the rest of the page — nothing crops open or grows. */
    .proj-media {
      max-width: 972px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s,
                  transform 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
    }
    body.media-ready .proj-media { opacity: 1; transform: none; }
    /* borderless: the element takes the video's own aspect ratio */
    .proj-media img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 78vh;
      margin: 0 auto;
    }
    /* A <video> has no intrinsic size until its metadata arrives, so without this it
       paints as a small default box and then jumps to full size. --ar (set from the
       project's ratio) reserves the exact final box: as wide as the column allows,
       never taller than 78vh. */
    .proj-media video {
      display: block;
      width: min(100%, calc(78vh * var(--ar, 1.7778)));
      height: auto;
      aspect-ratio: var(--ar, 1.7778);
      margin: 0 auto;
      background: #0d0c0b;
      object-fit: cover;
    }
    @media (max-width: 560px) {
      .proj-page { padding: calc(var(--nav-h) + 20px) 20px 24px; }
      .proj-media video { width: min(100%, calc(64vh * var(--ar, 1.7778))); }
      /* Title: fluid 28 → 36px so the longest single word ("Lucky7Collectives", 8.9× the
         font size wide) always fits the 280px column of a 320px phone; if a title does
         wrap, the lines get real leading and balance. break-word is only a last resort. */
      .proj-page .dest-page-title {
        font-size: clamp(1.75rem, 0.5rem + 6.5vw, 2.25rem);
        line-height: 1.08;
        margin-bottom: 24px;
        text-wrap: balance;
        overflow-wrap: break-word;
      }
      /* Copy: 16px on phones, on the 8/16/24/40 scale — title 24 dek 40 media 40 note 40 frames */
      .proj-page-caption { font-size: 16px; line-height: 1.65; margin: 0 auto 40px; }
      /* the long-form slot under the media reads as body copy: ragged-right, not a
         centred block of nine-line paragraphs */
      .proj-page-note { margin: 40px auto 0; text-align: left; }
    }

    #projFrames { margin-top: 48px; }
    /* frames rise in as you scroll — one-shot, staggered per row */
    .proj-page .m-item {
      opacity: 0;
      transform: translateY(-28px); /* scrolling down: frames settle downward into place */
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* re-armed after leaving through the top → it will re-enter while scrolling UP,
       so it settles upward: motion always follows the scroll direction */
    .proj-page .m-item.from-top { transform: translateY(28px); }
    .proj-page .m-item.in { opacity: 1; transform: none; }
    /* ── Frame rows — matched pairs share a row (walk1+walk2, …);
       flex-grow = each frame's aspect ratio, so everything in a row
       renders at exactly the same height. Unmatched singles sit in
       their own block after a visual breather. ── */
    .pf-row { display: flex; gap: 18px; margin-top: 18px; }
    .pf-row:first-child { margin-top: 0; }
    /* white behind every frame: the dark box the mosaic uses shows as a
       hairline along a screenshot's edge when the row height is fractional */
    .pf-row .m-item { min-width: 0; margin: 0; background: #fff; }
    .pf-frame { overflow: hidden; }
    .pf-frame img { width: 100%; height: 100%; object-fit: cover; }
    /* optional caption under a frame — quiet, left-aligned, 4.5:1 on white */
    /* a live site in a frame box: hairline edge so the white page inside reads as a screen */
    .pf-frame--embed { border: 1px solid rgba(0, 0, 0, 0.12); background: #fff; }
    .pf-frame--embed iframe { display: block; width: 100%; height: 100%; border: 0; }
    /* ── Enlarge: the same iframe (no reload, state kept) pops into a full-screen landscape
       overlay. On a portrait phone the frame is rotated 90°, so you turn the phone sideways. ── */
    .pf-cap--embed { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .pf-enlarge {
      display: none;
      align-items: center; gap: 8px;
      height: 40px; padding: 0 16px;
      border: 0; border-radius: 999px;
      background: #000; color: #fff;
      font-family: var(--font-sans); font-size: 13px; font-weight: 500; line-height: 1;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.625, 0.05, 0, 1), opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pf-enlarge svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .pf-enlarge:hover { transform: scale(0.95); }
    .pf-enlarge:active { transform: scale(0.9); }
    .pf-enlarge:focus-visible { outline: 2px solid #000; outline-offset: 3px; }
    @media (max-width: 960px), (pointer: coarse) { .pf-enlarge { display: inline-flex; } }

    html.embed-open, html.embed-open body { overflow: hidden; }
    /* position: fixed needs an untransformed ancestor chain to mean "the viewport" */
    html.embed-open .proj-page, html.embed-open .m-item { transform: none !important; transition: none !important; opacity: 1 !important; }
    .embed-scrim {
      position: fixed; inset: 0; z-index: 6990;
      background: #0d0c0b;
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    html.embed-open .embed-scrim { opacity: 1; pointer-events: auto; }
    .pf-frame--embed.is-enlarged {
      position: fixed; z-index: 7000;
      top: 50%; left: 50%;
      width: 100vw; height: 100vh; height: 100dvh;
      aspect-ratio: auto !important;
      border: 0;
      overflow: hidden;
      transform: translate(-50%, -50%);
      animation: embed-pop 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @media (orientation: portrait) {
      .pf-frame--embed.is-enlarged {
        width: 100vh; width: 100dvh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
        animation-name: embed-pop-rotated;
      }
    }
    @keyframes embed-pop {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
      to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes embed-pop-rotated {
      from { opacity: 0; transform: translate(-50%, -50%) rotate(90deg) scale(0.9); }
      to   { opacity: 1; transform: translate(-50%, -50%) rotate(90deg) scale(1); }
    }
    .pf-embed-close, .pf-embed-hint { display: none; }
    .is-enlarged .pf-embed-close {
      display: inline-flex; align-items: center; gap: 6px;
      position: absolute; left: 12px; bottom: 12px; z-index: 2;
      height: 36px; padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 999px;
      background: rgba(13, 12, 11, 0.72); color: #fff;
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      font-family: var(--font-sans); font-size: 13px; font-weight: 500;
      cursor: pointer;
    }
    .is-enlarged .pf-embed-hint {
      display: block;
      position: absolute; left: 50%; top: 14px; z-index: 2;
      transform: translateX(-50%);
      padding: 8px 14px; border-radius: 999px;
      background: rgba(13, 12, 11, 0.78); color: #fff;
      font-family: var(--font-sans); font-size: 13px; font-weight: 500; white-space: nowrap;
      pointer-events: none;
      animation: embed-hint 2.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @media (orientation: landscape) { .is-enlarged .pf-embed-hint { display: none; } }
    @keyframes embed-hint { 0% { opacity: 0; } 12%, 70% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pf-frame--embed.is-enlarged { animation-duration: 0.01s; }
    }
    .pf-cap--embed a { color: #000; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .pf-cap--embed a:hover { opacity: 0.6; }
    /* ── Embed preview (≤960px: every phone, both orientations, and small tablets) ──
       Both sites are desktop products: the demo's own narrow layout clips its tab bar and the
       deck is a fixed 16:9 canvas with no phone layout at all. So on small screens the frame
       keeps its desktop ratio and shows the site laid out at desktop width, scaled down to the
       column (wireEnlarge › layout). That rendering is a picture, not a UI: the iframe takes no
       touches (it can't trap the page's scroll) and the whole frame is one button that opens the
       full-screen overlay, where the site is live. */
    @media (max-width: 960px) {
      /* :not(.is-enlarged) — same specificity as the overlay's position: fixed, and later in the sheet */
      .pf-frame--embed.is-preview:not(.is-enlarged) { position: relative; }
      .pf-frame--embed.is-preview iframe { max-width: none; }
      .pf-frame--embed.is-preview:not(.is-enlarged) iframe { pointer-events: none; }
      .pf-embed-open {
        position: absolute; inset: 0; z-index: 1;
        display: flex; align-items: flex-end; justify-content: center;
        padding: 12px;
        border: 0; color: inherit;
        /* a white veil rises under the pill: the rendering fades out instead of colliding
           with it, which also says "preview" rather than "tiny live page" */
        background: linear-gradient(to top, rgba(255, 255, 255, 0.96) 0%, rgba(255, 255, 255, 0.82) 22%, rgba(255, 255, 255, 0) 48%);
        cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      .pf-embed-open__pill {
        display: inline-flex; align-items: center; gap: 8px;
        height: 36px; padding: 0 14px 0 12px;
        border-radius: 999px;
        background: #000; color: #fff;
        font-family: var(--font-sans); font-size: 13px; font-weight: 500; line-height: 1;
        box-shadow: 0 1px 2px rgba(13, 12, 11, 0.2), 0 10px 24px -8px rgba(13, 12, 11, 0.35);
        transition: transform 0.3s cubic-bezier(0.625, 0.05, 0, 1);
      }
      .pf-embed-open__pill svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .pf-embed-open:active .pf-embed-open__pill { transform: scale(0.9); }
      .pf-embed-open:focus-visible { outline: 2px solid #000; outline-offset: -4px; }
      .pf-frame--embed.is-enlarged .pf-embed-open { display: none; }

  <script>

        ] },

          'What started as getting back into a childhood hobby turned into Lucky7Collectives, a Pokémon card and collectibles business I ran with my friend Brent. Pokemon cards were starting to make a comeback, and we got in at the perfect time. We started buying cards on Whatnot streams for as little as a dollar. If it looked cool, we bought it.',
          'Before long, we had boxes of cards sitting around our houses. We started attending card shows, built up our inventory, and eventually became vendors ourselves. Over time, we sold to 200+ customers, attended 15+ card shows, and built a community of 1,000+ collectors on Instagram, connecting with buyers and sellers around the world. I handled operations, marketing, and sales negotiations.',

    };
    const params = new URLSearchParams(window.location.search);
    const proj = PROJECTS[params.get('p')] || PROJECTS.california;

    document.getElementById('projPageTitle').textContent = proj.title;
    // Copy slots: `caption` sits under the title, `note` under the film.
    // One <p> per paragraph; a paragraph may be a list of segments where a
    // segment with an href becomes a link (only once a real URL is set).
    // Pages without copy for a slot drop that element entirely.
    function renderCopy(id, paras) {
      const el = document.getElementById(id);
      if (!paras || !paras.length) { el.remove(); return; }
      paras.forEach(function (para) {
        const p = document.createElement('p');
        if (para && para.heading) {           // { heading: '…' } → bold display line
          p.className = 'proj-copy-heading';
          p.textContent = para.heading;
          el.appendChild(p);
          return;
        }
        (Array.isArray(para) ? para : [para]).forEach(function (seg) {
          if (typeof seg === 'string') { p.appendChild(document.createTextNode(seg)); return; }
          if (seg.href) {
            const a = document.createElement('a');
            a.href = seg.href; a.target = '_blank'; a.rel = 'noopener';
            a.textContent = seg.text;
            p.appendChild(a);
          } else {
            p.appendChild(document.createTextNode(seg.text));
          }
        });
        el.appendChild(p);
      });
    }
    renderCopy('projPageCaption', proj.caption);
    renderCopy('projPageNote', proj.note);

    // ── Lighter media on small screens ─────────────────────────
    // The frames are 3–4 MB 4K stills (California: 52 MB a visit). At ≤960px every image under
    // public/projects/ is requested from the m/ folder beside it instead — same base name, always
    // .jpg, long edge 1400px (public/projects/x/top1.jpg → public/projects/x/m/top1.jpg).
    // Desktop asks for exactly the files it always has. A missing variant falls back to the original.
    const SMALL_SCREEN = window.matchMedia('(max-width: 960px)').matches;
    function setSrc(img, src) {
      let light = src;
      if (SMALL_SCREEN && src.indexOf('public/projects/') === 0) {
        const cut = src.lastIndexOf('/') + 1;
        light = src.slice(0, cut) + 'm/' + src.slice(cut).replace(/\.[a-z0-9]+$/i, '.jpg');
        img.addEventListener('error', function () { img.src = src; }, { once: true });
      }
      img.src = light;
    }
    // Not autoplayed — the film has real sound, and browsers block
    // unmuted autoplay outside a user gesture. Native controls only.
    // media: a film, a still, or nothing yet
    const mediaEl = document.querySelector('.proj-media');
    const videoEl = document.getElementById('projVideo');
    // The reveal (clip-path opening) waits until the media can actually paint —
    // a decoded still or a video with its first frame — so it never opens on an
    // empty box. Capped at 1.6s so a slow network can't hold the page hostage.
    let mediaReady = Promise.resolve();
    const cap = (p) => Promise.race([p, new Promise(r => setTimeout(r, 1600))]);
    if (proj.video) {
      if (proj.ratio) videoEl.style.setProperty('--ar', (proj.ratio[0] / proj.ratio[1]).toFixed(4));
      if (proj.poster) {
        // the poster is the film's own first frame, so play starts with no visual jump
        videoEl.poster = proj.poster;
        const posterImg = new Image();
        posterImg.src = proj.poster;
        mediaReady = cap(posterImg.decode().catch(function () {}));
      } else {
        mediaReady = cap(new Promise(r => {
          if (videoEl.readyState >= 2) r(); else videoEl.addEventListener('loadeddata', r, { once: true });
        }));
      }
      // WebKit keeps `load` open until a <video>'s metadata has arrived, and holds the first animation
      // frame — which this page's entrance waits on — until `load`. For a 33 MB film on a phone
      // connection that is seconds of blank page. So small screens give the player its film once the
      // page has loaded: the poster is already up, the box is already reserved, nothing moves.
      if (SMALL_SCREEN && proj.poster) {
        const arm = function () { if (!videoEl.hasAttribute('src')) videoEl.src = proj.video; };
        if (document.readyState === 'complete') arm();
        else { window.addEventListener('load', arm, { once: true }); setTimeout(arm, 2500); }
      } else {
        videoEl.src = proj.video;
      }
    } else if (proj.image) {
      const still = document.createElement('img');
      still.alt = proj.title;
      still.decoding = 'async'; still.fetchPriority = 'high';
      setSrc(still, proj.image);
      videoEl.replaceWith(still);
      mediaReady = cap(still.decode().catch(function () {}));
    } else {
      mediaEl.remove();
    }

    // ── Frames from the shoot — matched pairs share a row, the
    //    unmatched singles get their own block after a breather ─────
    const WIPBASE = 'public/projects/wip/';
    const WIP_ROWS = [
      { items: [ ['subway1.jpg', 3840, 2160], ['subway2.jpg', 3840, 2160] ] },
      { items: [ ['street1.jpg', 3840, 2160], ['street2.jpg', 3840, 2160] ] },
      { items: [ ['clothing1.jpg', 3840, 2160], ['clothing2.jpg', 3840, 2160] ] },
      { items: [ ['mirror1.jpg', 3840, 2160], ['mirror2.jpg', 3840, 2160] ] },
      { items: [ ['walk1.jpg', 3840, 2160], ['walk2.jpg', 3840, 2160] ] },
      { cls: 'pf-row--break pf-row--trio',
        items: [ ['noti.jpg', 1080, 1920], ['wip.jpg', 1080, 1920], ['sad.png', 1044, 1882] ] },
      { cls: 'pf-row--solo', items: [ ['meetup-crop.png', 1160, 980] ] },
    ];
    // California — the trip told in order: Rodeo Drive, the drive, the
    // people, the water, the sunset, the canyon, the game on the sand.
    // Row shapes carry the pacing — pairs for the beats you linger on,
    // trios for the quick details, one full-width frame for the sunset.
    const CALIFORNIA_ROWS = [
      // opener: one frame alone on the top row

      { cls: 'pf-row--full', items: [ ['top2.jpg', 3840, 2160] ] },
      // the drive down — both cut to one frame size so the burned-in

      { cls: 'pf-row--break', items: [ ['drive-sd.jpg', 1595, 1094], ['ucla.jpg', 1595, 1094] ] },
      // the water

    // each project's frames live in their own folder

    const LUCKY7_ROWS = [
      // three portraits from the shows: our table, the three of us, the graded case
      { cls: 'pf-row--trio', items: [ ['vendor-table.jpg', 1206, 1566], ['team.jpg', 1656, 2208, 'Me and Brent in 2024 with Mark, owner of Royal Card Shop.'], ['graded-case.jpg', 2400, 3200] ] },
      // the display case laid out on the table — a held beat

    ];

    // Robin's demo and deck are live: the rows embed the actual sites, so the page
    // is as good as clicking the links. An item given as { embed, w, h, label, href }
    // renders an iframe in the same frame box, with a caption and an open-in-new-tab link.
    // `virtualWidth`: lay the site out at this desktop width and scale it to fit — in the
    // full-screen overlay and in the small-screen preview. `previewWidth`: the same, preview only
    // (the deck is a fluid 16:9 canvas, so full screen it simply fills the turned phone).
    const ROBIN_ROWS = [
      { cls: 'pf-row--full', items: [ { embed: 'https://salesforceapp.vercel.app/', w: 16, h: 10, label: 'Live demo', virtualWidth: 1180 } ] },
      { cls: 'pf-row--break pf-row--full', items: [ { embed: 'https://robinslidedeck.vercel.app/', w: 16, h: 9, label: 'Slide deck', previewWidth: 1180, keys: true } ] },
    ];

    const PROJECT_FRAMES = {
      robin:      { base: 'public/projects/robin/',      rows: ROBIN_ROWS },
      wip:        { base: 'public/projects/wip/',        rows: WIP_ROWS },
      california: { base: 'public/projects/california/', rows: CALIFORNIA_ROWS },
      lucky7:     { base: 'public/projects/lucky7/',     rows: LUCKY7_ROWS },
    };

    // one-shot scroll reveal, staggered by position within its row
    // Frame reveals behave the same scrolling down and up: a frame animates in whenever
    // it enters the viewport, from the side it enters by. Once a frame is fully off screen
    // it is re-armed (invisibly) to come back from that same side.
    const frameRevealObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    const frameResetObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) return;
        const el = e.target;
        el.classList.toggle('from-top', e.boundingClientRect.bottom <= 0); // left via the top
        el.classList.remove('in');
      });
    }, { threshold: 0 });

    // ── Enlarge an embed: pop the SAME iframe into a full-screen landscape overlay ─────
    // Nothing is reloaded, so the deck keeps its slide and the demo keeps its state.
    // `it.virtualWidth` lays the site out at a desktop width and scales it to fit, so the
    // whole desktop UI is visible (and still tappable) on a phone turned sideways.
    const htmlEl = document.documentElement;
    const embedScrim = document.createElement('div');
    embedScrim.className = 'embed-scrim';
    document.body.appendChild(embedScrim);
    let openEmbedState = null;
    // \u2264960px the embeds are scaled desktop previews that open the overlay on tap (see the CSS)
    const previewMQ = window.matchMedia('(max-width: 960px)');
    function wireEnlarge(frame, ifr, it) {
      const origin = new URL(it.embed).origin;
      const post = (type, extra) => { try { ifr.contentWindow.postMessage(Object.assign({ source: 'robin-host', type: type }, extra || {}), origin); } catch (e) {} };
      const touchLike = () => window.matchMedia('(max-width: 960px), (pointer: coarse)').matches;

      const closeBtn = document.createElement('button');
      closeBtn.type = 'button'; closeBtn.className = 'pf-embed-close'; closeBtn.textContent = '\u2715  Close';
      const hint = document.createElement('div');
      hint.className = 'pf-embed-hint'; hint.textContent = 'Turn your phone sideways';
      frame.appendChild(closeBtn); frame.appendChild(hint);
      let opener = null;                                       // the whole-frame "Open \u2026" button, small screens only

      function layout() {
        const enlarged = frame.classList.contains('is-enlarged');
        const vw = enlarged ? it.virtualWidth : (previewMQ.matches ? (it.previewWidth || it.virtualWidth) : 0);
        const L = frame.clientWidth, S = frame.clientHeight;   // layout box inside the hairline, unaffected by the rotation
        if (vw && L && L < vw) {
          const k = L / vw;
          ifr.style.width = vw + 'px'; ifr.style.height = (S / k) + 'px';
          ifr.style.transformOrigin = '0 0'; ifr.style.transform = 'scale(' + k + ')';
        } else { ifr.style.width = ifr.style.height = ifr.style.transform = ifr.style.transformOrigin = ''; }
      }
      // Small screens: the frame becomes one button over a scaled, untouchable rendering.
      // Built on demand, so a desktop load adds nothing to the page.
      function syncPreview() {
        const on = previewMQ.matches;
        frame.classList.toggle('is-preview', on);
        if (on && !opener) {
          const name = it.label || 'embed';
          opener = document.createElement('button');
          opener.type = 'button'; opener.className = 'pf-embed-open';
          opener.setAttribute('aria-label', 'Open ' + name + ' full screen');
          const pill = document.createElement('span');
          pill.className = 'pf-embed-open__pill';
          pill.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
          pill.appendChild(document.createTextNode('Open ' + name.toLowerCase()));
          opener.appendChild(pill);
          opener.addEventListener('click', function () { open(false); });
          frame.appendChild(opener);
        }
        // a preview is a picture: out of the tab order and hidden from assistive tech until opened
        ifr.toggleAttribute('inert', on && !frame.classList.contains('is-enlarged'));
        layout();
      }
      function open(fromEmbed) {
        if (openEmbedState) return;
        const cell = frame.parentElement;
        cell.style.minHeight = cell.offsetHeight + 'px';       // hold the page's layout while the frame is out of flow
        openEmbedState = { close: close, y: window.scrollY };
        hint.textContent = Math.min(window.innerWidth, window.innerHeight) >= 600 ? 'Turn your tablet sideways' : 'Turn your phone sideways';
        htmlEl.classList.add('embed-open'); frame.classList.add('is-enlarged');
        ifr.removeAttribute('inert');
        layout();
        if (!fromEmbed) post('enter-fullscreen');
        history.pushState({ embedOpen: true }, '');            // the phone's Back gesture closes it
        closeBtn.focus({ preventScroll: true });
      }
      function close(fromPop, fromEmbed) {
        if (!openEmbedState) return;
        const y = openEmbedState.y; openEmbedState = null;
        frame.classList.remove('is-enlarged'); htmlEl.classList.remove('embed-open');
        syncPreview();                                         // back to the scaled preview (or to a plain frame on a wide screen)
        frame.parentElement.style.minHeight = '';
        window.scrollTo(0, y);
        if (!fromEmbed) post('exit-fullscreen');
        if (!fromPop && history.state && history.state.embedOpen) history.back();
        const back = opener && previewMQ.matches ? opener : btn;
        if (back && back.offsetParent) back.focus({ preventScroll: true });
      }
      syncPreview();
      if (previewMQ.addEventListener) previewMQ.addEventListener('change', syncPreview); else previewMQ.addListener(syncPreview);
      // the preview's scale follows the column: first layout, rotation, a resized window
      if (window.ResizeObserver) new ResizeObserver(layout).observe(frame);
      closeBtn.addEventListener('click', function () { close(false, false); });
      window.addEventListener('resize', function () { if (openEmbedState && frame.classList.contains('is-enlarged')) layout(); });
      window.addEventListener('popstate', function () { if (openEmbedState && frame.classList.contains('is-enlarged')) close(true, false); });
      // the deck speaks a small protocol: it announces itself, and its own enlarge button
      // asks us to take the frame full screen (iPhones have no Fullscreen API for pages)
      window.addEventListener('message', function (e) {
        if (e.origin !== origin || e.source !== ifr.contentWindow || !e.data || e.data.source !== 'robin-deck') return;
        if (e.data.type === 'ready') post('hello', { manageFullscreen: touchLike() });
        if (e.data.type === 'fullscreen') { if (e.data.on) open(true); else close(false, true); }
      });
      ifr.addEventListener('load', function () { post('hello', { manageFullscreen: touchLike() }); });

      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'pf-enlarge';
      btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>Enlarge';
      btn.setAttribute('aria-label', 'Enlarge ' + (it.label || 'embed') + ' to full screen');
      btn.addEventListener('click', function () { open(false); });
      return btn;
    }

    const frameSet = PROJECT_FRAMES[params.get('p')] || { base: '', rows: [] };
    const frameRows = frameSet.rows;
    const framesWrap = document.getElementById('projFrames');
    if (!frameRows.length) {
      framesWrap.remove();
    } else {
      frameRows.forEach(function (row) {
        const rowEl = document.createElement('div');
        rowEl.className = 'pf-row' + (row.cls ? ' ' + row.cls : '');
        const rowCaps = [];
        row.items.forEach(function (it, i) {
          const cell = document.createElement('figure');
          cell.className = 'm-item';
          const w = Array.isArray(it) ? it[1] : it.w, h = Array.isArray(it) ? it[2] : it.h;
          // flex-grow = aspect ratio → every frame in the row shares one height
          if (row.items.length > 1) cell.style.flex = (w / h) + ' 1 0';
          cell.style.transitionDelay = (i * 0.09) + 's';
          const frame = document.createElement('div');
          frame.className = 'pf-frame';
          frame.style.aspectRatio = w + ' / ' + h;
          if (!Array.isArray(it) && it.embed) {           // live site in the frame box
            frame.classList.add('pf-frame--embed');
            cell.classList.add('m-item--embed');
            cell.style.setProperty('--ar-num', (w / h).toFixed(4));   // lets CSS cap the preview's height on a phone held sideways
            const ifr = document.createElement('iframe');
            ifr.src = it.embed;
            ifr.title = it.label || proj.title;
            ifr.loading = 'lazy';
            ifr.allow = 'fullscreen';
            ifr.referrerPolicy = 'no-referrer-when-downgrade';
            frame.appendChild(ifr);
            cell.appendChild(frame);
            if (it.keys) {
              // keyboard-driven embed (the deck): give it focus as soon as it is mostly on
              // screen so ← → work without a click, and hand focus back when it scrolls away
              new IntersectionObserver(function (entries) {
                entries.forEach(function (en) {
                  if (en.isIntersecting) { if (!previewMQ.matches) ifr.focus({ preventScroll: true }); }   // a preview takes no input
                  else if (document.activeElement === ifr) { ifr.blur(); }
                });
              }, { threshold: 0.6 }).observe(ifr);
            }
            const cap = document.createElement('figcaption');
            cap.className = 'pf-cap pf-cap--embed';
            const capText = document.createElement('span');
            capText.appendChild(document.createTextNode((it.label || '') + '  ·  '));
            const a = document.createElement('a');
            a.href = it.embed; a.target = '_blank'; a.rel = 'noopener';
            a.textContent = 'Open in a new tab \u2197';
            capText.appendChild(a);
            cap.appendChild(capText);
            cap.appendChild(wireEnlarge(frame, ifr, it));
            cell.appendChild(cap);
            rowEl.appendChild(cell);
            frameRevealObs.observe(cell); frameResetObs.observe(cell);
            return;
          }
          const img = document.createElement('img');
          img.alt = it[3] || (proj.title + ' — ' + it[0].replace(/\.[a-z]+$/, ''));
          img.loading = 'lazy';
          setSrc(img, frameSet.base + it[0]);
          frame.appendChild(img);
          cell.appendChild(frame);
          if (it[3]) {                       // optional 4th entry: a caption
            const cap = document.createElement('figcaption');
            cap.className = 'pf-cap';
            cap.textContent = it[3];
            cell.appendChild(cap);
            // shared row on a small screen: the caption is also set under the whole row
            // (CSS swaps the two at ≤560px — a ~100px column is no place for a sentence)
            if (SMALL_SCREEN && row.items.length > 1) {
              rowCaps.push({ text: it[3], at: i === 0 ? 'start' : (i === row.items.length - 1 ? 'end' : 'center') });
            }
          }
          rowEl.appendChild(cell);
          frameRevealObs.observe(cell); frameResetObs.observe(cell);
        });
        rowCaps.forEach(function (c) {
          const p = document.createElement('p');
          p.className = 'pf-cap pf-cap--row';
          p.dataset.at = c.at;
          p.textContent = c.text;
          rowEl.classList.add('has-rowcap');
          rowEl.appendChild(p);
          frameRevealObs.observe(p); frameResetObs.observe(p);
        });
        framesWrap.appendChild(rowEl);
      });
    }

    // On touch / small screens the entrance never depends on an animation frame alone: WebKit can
    // hold the first frame until `load`, which would leave the page at opacity 0. A timer backs it up.
    const TOUCH_LIKE = window.matchMedia('(max-width: 960px), (pointer: coarse)').matches;
    document.addEventListener('DOMContentLoaded', () => {
      let revealed = false;
      const reveal = () => {
        if (revealed) return;
        revealed = true;
        document.body.classList.add('ready');
        document.querySelectorAll('.fade-up').forEach(el => el.classList.add('in'));
        mediaReady.then(() => document.body.classList.add('media-ready'));
      };
      requestAnimationFrame(() => requestAnimationFrame(reveal));
      if (TOUCH_LIKE) setTimeout(reveal, 160);
    });

    // ── Mobile hamburger menu ─────────────────────────────────
    const hamburger  = document.getElementById('navHamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    function toggleMenu(force) {
      const open = typeof force === 'boolean' ? force : !hamburger.classList.contains('open');
      hamburger.classList.toggle('open', open);
      mobileMenu.classList.toggle('open', open);
      mobileMenu.setAttribute('aria-hidden', String(!open));
      hamburger.setAttribute('aria-expanded', String(open));
      hamburger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      document.body.style.overflow = open ? 'hidden' : '';
    }

    hamburger.addEventListener('click', () => toggleMenu());

    // Fade to black before leaving — every nav link here goes back to
    // index.html, there's nowhere on this page itself to navigate to.
    document.querySelectorAll('#home-link, .nav-links a, #mobileMenu a').forEach(el => {
      el.addEventListener('click', e => {
        e.preventDefault();
        toggleMenu(false);
        const dest = el.getAttribute('href');
        pageLeave(dest);
      });
    });

    // ── Page enter ────────────────────────────────────────────
    // Arrivals fade in over 0.55s (the exit fade's length), so a fresh
    // load, a link, and the browser's Back button all feel the same.
    // On a bfcache restore the exit fade's inline opacity:0 is still on
    // <body>; restart the fade from there instead of snapping to 1.
    (function () {
      const html = document.documentElement, body = document.body;
      function enter() {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { html.classList.remove('page-enter'); });
        });
        // touch / small screens: same timer backstop as the reveal above (removing the class twice is harmless)
        if (TOUCH_LIKE) setTimeout(function () { html.classList.remove('page-enter'); }, 160);
      }
      enter();
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        body.style.transition = 'none';
        body.style.opacity = '';
        html.classList.remove('page-exit');
        html.classList.add('page-enter');
        void body.offsetWidth;
        body.style.transition = '';
        enter();
      });
    })();
  </script>

  <script>
    // Wordmark: once-per-session explosion intro, hover boops + boom jolt.
    (function () {
      const mark = document.querySelector('.wordmark');
      if (!mark) return;
      const letters = mark.querySelectorAll('.wm-l');
      const boom = mark.querySelector('.wm-boom');
      if (!sessionStorage.getItem('wmIntroPlayed')) {
        sessionStorage.setItem('wmIntroPlayed', '1');
        mark.classList.add('wm-intro');
        setTimeout(function () { mark.classList.remove('wm-intro'); }, 1700);
      }
      letters.forEach(function (l) {
        l.addEventListener('animationend', function () { l.classList.remove('wm-boop'); });
        l.addEventListener('mouseenter', function () {
          if (!mark.classList.contains('wm-intro') && !l.classList.contains('wm-boop')) l.classList.add('wm-boop');
        });
      });
      if (boom) {
        boom.addEventListener('animationend', function () { boom.classList.remove('wm-jolt'); });
        mark.addEventListener('mouseenter', function () {
          if (!mark.classList.contains('wm-intro') && !boom.classList.contains('wm-jolt')) boom.classList.add('wm-jolt');
        });
      }
    })();
  </script>
  <script>
    // Hide the nav while scrolling down, bring it back on scroll-up or near the top,
    // and never while the mobile menu is open.
    (function () {
      const nav = document.querySelector('nav');
      if (!nav) return;
      const SHOW_AT = 80, DELTA = 6;
      let last = window.scrollY, hidden = false, ticking = false;
      const small = window.matchMedia('(max-width: 960px)');
      function update() {
        ticking = false;
        let y = window.scrollY;
        if (small.matches) {
          // iOS rubber-banding reports scroll positions past both ends; read them as the ends,
          // or the bounce at the foot of the page counts as a scroll-up and pops the nav in
          y = Math.max(0, Math.min(y, document.documentElement.scrollHeight - window.innerHeight));
          // backing behind the nav whenever it can sit over content (see nav::before) —
          // the same treatment as the homepage and the destination pages
          nav.classList.toggle('nav-solid', y > 8);
        }
        const menuOpen = !!document.querySelector('.nav-hamburger.open');
        let want = hidden;
        if (menuOpen || y <= SHOW_AT || y < last - DELTA) want = false;
        else if (y > last + DELTA) want = true;
        if (want !== hidden) { hidden = want; nav.classList.toggle('nav-hidden', hidden); }
        last = y;
      }
      window.addEventListener('scroll', function () {
        nav.classList.add('nav-scroll');
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }, { passive: true });
    })();

    // Phones / tablets: every photo (the still and all the frames — not the film, not the live
    // embeds) opens in a full-screen viewer with ‹ 3 / 15 › at the bottom
    // (public/js/photo-lightbox.js). Requested only on small or touch screens, so desktop loads
    // nothing new and its DOM is untouched.
    if (window.matchMedia('(max-width: 960px), (pointer: coarse)').matches) {
      window.PHOTO_LIGHTBOX = { selector: '.proj-media img, #projFrames .pf-frame:not(.pf-frame--embed) img' };
      const plb = document.createElement('script');
      plb.src = 'public/js/photo-lightbox.js';
      document.body.appendChild(plb);
    }
  </script>
</body>
</html>
